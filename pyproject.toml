[project]
name = "mw_skill"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=5.3.1",
  "tensorboard>=2.2.1",
  "tensorboardX",
  "setproctitle",
  "pettingzoo[mpe,sisl]==1.24.3",
  "wandb>=0.18.7",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "rich>=13.9.4",
  "hydra-submitit-launcher>=1.2.0",
  "hydra-colorlog>=1.2.0",
  "supersuit>=3.9.3",
  "matplotlib>=3.7.5",
  "imageio>=2.35.1",
  "moviepy>=1.0.3",
  "python-dotenv>=1.0.1",
  "hydra-joblib-launcher>=1.2.0",
  "swanlab>=0.6.3",
  "neptune>=1.14.0",
  "tensorflow-io-gcs-filesystem>=0.23.1",
  "neptune-tensorboard>=1.0.3",
  "protobuf>=3.20",
  "torch",
  "openai>=1.92.2",
  "dotenv>=0.9.9",
  "asyncio>=3.4.3",
  "httpx[socks]>=0.28.1",
  "harl",
  "sumo_rl",
  "mapdn",
  "seaborn>=0.13.2",
  "ray[rllib]>=2.7.0",
  "dacite>=1.9.2",
  "pyvirtualdisplay>=3.0",
  "libsumo>=1.24.0",
  "gdown>=5.2.0",
  "prompt-template>=1.2.0",
]
[tool.uv.sources]
harl = { workspace = true }
sumo_rl = { workspace = true }
mapdn = { workspace = true }

[tool.uv.workspace]
members = ["packages/HARL", "packages/SUMO", "packages/MAPDN"]

[[tool.uv.index]]
url = "https://mirrors.cernet.edu.cn/pypi/web/simple" # for China
default = true

[tool.ruff]
exclude = [
  "packages/SUMO",
  "packages/MAPDN",
]