defaults:
  - default
  - _self_

run_group: 250708_test
save_group: handpicked/0714 # 0710/0322
# save_group: 0711/0109
steps:
  - type: eval
    config_name: default
    multirun: False
    args:
      - ++environment.env_tweak.tweak_types=[max_cycles,terminate_reward,reward_factor]
      - ++environment.env_tweak.max_cycles=1000
      - ++environment.env_tweak.terminate_reward=-10.0
      - ++environment.env_tweak.reward_factor=0.15
      - ++environment.env_tweak.n_walkers=2
  - type: bark
    args:
      - train_finish
hydra:
  searchpath: 
    - file://sources/skill/0.run

