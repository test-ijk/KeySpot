defaults:
  - algorithm: mappo
  - environment: sumo
  - scenario: raw

  - algorithm_parameters: ${algorithm}
  - environment_parameters: ${environment}
  - optional environment_scenario: ${environment}/${scenario}
  - eval_scenario: ${environment}/${scenario}
  - override hydra/launcher: submitit_local
  - _self_

wandb:
  wandb_name: 02s
  wandb_group: latest
  wandb_project: mw_skill

model:
  save_group: latest
  model_path: default

eval_settings:
  general:
    seed: 42
    eval_episodes: 10
    eval_threads: 10

  functions:
    load_results: False
    result_file_name: hi

    render: False
    render_episodes: 1

    ablation: False
    
    use_gpu: False

    export_angle_data: False



hydra:
  searchpath:
    - file://sources/skill/1.config/global
  launcher:
    timeout_min: 6000
    gpus_per_node: 1
  run:
    dir: ./results/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ./results/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}