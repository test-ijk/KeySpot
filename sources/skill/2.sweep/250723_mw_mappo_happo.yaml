program: sources.skill.code.train
method: bayes
project: harl_full_sweep
name: 250723_mappo_happo
metric:
  goal: maximize
  name: eval_average_episode_rewards.max
parameters:
  algorithm_parameters.model.lr:
    values: [0.0001, 0.001]
  algorithm_parameters.algo.ppo_epoch:
    values: [5, 10, 15]
  algorithm_parameters.algo.actor_num_mini_batch:
    values: [1, 2, 4]
  algorithm:
    values: [hasac]
command:
  - ${env}
  - uv
  - "run"
  - "python"
  - "-m"
  - ${program}
  - "wandb.wandb_group=250709_sweep2_1"
  - "++wandb.wandb_project=mw_harl_sweep2_1"
  - "model.save_group=latest"
  - "scenario=raw"
  - "environment=mapdn"
  - "++algorithm_parameters.train.n_rollout_threads=20"
  - "++environment.env_tweak.max_cycles=1000"
  - "++environment.env_tweak.terminate_reward=-10.0"
  - "algorithm_parameters.train.num_env_steps=30000000"
  - ${args_no_hyphens}